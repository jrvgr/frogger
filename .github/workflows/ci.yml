name: CI

on:
  push:
    branches: [main]  # other branches run as their pull request; tags run from release.yml
  pull_request:
  workflow_call:      # release.yml runs every check before it publishes
    inputs:
      all:
        description: Run every job, whatever changed
        type: boolean
        default: true

permissions:
  contents: read

# A new push stops the older run for the same pull request or branch (main too: only its
# latest commit matters). A release's checks have their tag's group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed, so a docs-only change doesn't boot the emulator. A job skipped here
  # counts as passed for branch protection. Releases (workflow_call) run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: ${{ !inputs.all }}
    permissions:      # a job's list replaces the workflow's, so contents again for checkout
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      build: ${{ steps.filter.outputs.build }}
      emulator: ${{ steps.filter.outputs.emulator }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - flake.nix
              - flake.lock
              - pyproject.toml
            lint:
              - *ci
              - '**/*.py'
              - '**/*.sh'
              - ruff.toml
            build:
              - *ci
              - loader/**
              - payload/**
              - tools/**
              - tests/**
            emulator:
              - *ci
              - loader/**
              - payload/**
              - tools/**          # the firmware unit tests run here too (install.py, hide, emu)
              - tests/**
              - .gitmodules
              - third_party/**

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: ruff (errors only, see ruff.toml) and shellcheck
        run: |
          nix shell --inputs-from . nixpkgs#ruff nixpkgs#shellcheck -c bash -c \
            'ruff check . && shellcheck tools/*.sh tools/emupod/*.sh'

  build:
    name: Build and unit tests
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      # The Nix store (the dev shell's toolchain), kept until flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 3G
      - name: Build the loader and payload
        run: nix develop -c make -C loader
      - name: Unit tests that don't need Apple's firmware
        run: nix develop -c pytest -v -m 'not firmware and not emupod'

  # install.py's raw-disk code, podinfo and coverart on the other OSes people install from
  # (the build job runs them on Linux). Plain Python, no nix: what a user has.
  portable:
    name: Unit tests on ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow
      - name: install.py, podinfo and coverart tests
        run: python -m pytest -v -m "not firmware and not emupod" tests/test_install.py tests/test_podinfo.py tests/test_coverart.py

  emulator:
    name: Firmware and emulator tests
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.emulator == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: cachix/install-nix-action@v30
      # The Nix store (the dev shell's toolchain), kept until flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-emu-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-emu-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      # Apple's firmware is never in this repo: it's fetched from Apple (once, then from the
      # Actions cache) and checked.
      - uses: actions/cache@v4
        with:
          path: firmware/iPod_2.2.3.ipsw
          key: ipsw-2.2.3-bec081f2
      - name: Firmware 2.3 from Apple
        run: |
          mkdir -p firmware
          [ -f firmware/iPod_2.2.3.ipsw ] || \
          curl -fsSL -o firmware/iPod_2.2.3.ipsw \
            https://secure-appldnld.apple.com/iPod/SBML/osx/bundles/061-2687.20060912.IPwdC/iPod_2.2.3.ipsw
          echo "bec081f2bacd4099dcfc533048a6844c8fafb50197c60d9d7ef95075cf2c6e92  firmware/iPod_2.2.3.ipsw" | sha256sum -c
      # The built emupod library, keyed on what goes into it: the pinned submodule, our patch
      # and the toolchain. Saved right after the build, so a failing test doesn't lose it.
      - name: emupod cache key
        id: emupod-key
        run: echo "key=emupod-so-${{ runner.os }}-$(git rev-parse HEAD:third_party/emupod)-${{ hashFiles('tools/emupod/emupod-gen3.patch', 'flake.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: emupod-cache
        with:
          path: third_party/emupod/emupod/emupod_rs.abi3.so
          key: ${{ steps.emupod-key.outputs.key }}
      - name: emupod (patched; built unless cached)
        run: nix develop .#emu -c tools/emupod/setup.sh
        env:
          EMUPOD_PREBUILT: ${{ steps.emupod-cache.outputs.cache-hit }}
      - uses: actions/cache/save@v4
        if: steps.emupod-cache.outputs.cache-hit != 'true'
        with:
          path: third_party/emupod/emupod/emupod_rs.abi3.so
          key: ${{ steps.emupod-key.outputs.key }}
      - name: Build
        run: |
          nix develop .#emu -c python3 tools/fwtool.py extract firmware/iPod_2.2.3.ipsw -o build/fw
          nix develop .#emu -c make -C loader
      # --require-firmware: a missing firmware file fails the job instead of skipping its tests.
      - name: Unit tests that need Apple's firmware (the rest ran in the build job)
        run: nix develop .#emu -c pytest -v --require-firmware -m 'firmware and not emupod'
      - name: Test cards
        run: nix develop .#emu -c python3 tools/emupod/mkcards.py
      - name: Emulator tests
        run: nix develop .#emu -c pytest -v -n auto --durations=0 --require-firmware -m emupod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: emupod-logs
          path: |
            build/emupod-work/logs
            build/emupod-work/*.png
