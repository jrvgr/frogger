name: CI

on:
  push:
    branches: [main]  # other branches run as their pull request; tags run from release.yml
  pull_request:
  workflow_call:      # release.yml runs every check before it publishes
    inputs:
      all:
        description: Run every job, whatever changed
        type: boolean
        default: true

permissions:
  contents: read

# A new push stops the older run for the same pull request or branch (main too: only its
# latest commit matters). A release's checks have their tag's group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts changed, so a docs-only change doesn't boot the emulator. A job skipped here
  # counts as passed for branch protection. Releases (workflow_call) run everything.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    if: ${{ !inputs.all }}
    permissions:      # a job's list replaces the workflow's, so contents again for checkout
      contents: read
      pull-requests: read
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      build: ${{ steps.filter.outputs.build }}
      emulator: ${{ steps.filter.outputs.emulator }}
    steps:
      # A push to main that is a merged pull request's commit: that PR's run already tested it,
      # so nothing runs again. Direct pushes to main still get the full checks.
      - name: Merged pull request?
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                 --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$GITHUB_SHA\")][0].number // empty")
          if [ -n "$pr" ]; then echo "From pull request #$pr: its checks passed there, skipping."; echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v7
        if: steps.merged.outputs.yes != 'true'
      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.merged.outputs.yes != 'true'
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
              - .github/scripts/**
              - flake.nix
              - flake.lock
              - pyproject.toml
            lint:
              - *ci
              - '**/*.py'
              - '**/*.sh'
              - ruff.toml
            build:
              - *ci
              - loader/**
              - payload/**
              - tools/**
              - tests/**
            emulator:
              - *ci
              - loader/**
              - payload/**
              - tools/**          # the firmware unit tests run here too (install.py, hide, emu)
              - tests/**
              - .gitmodules
              - third_party/**

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.lint == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: ruff (errors only, see ruff.toml) and shellcheck
        run: |
          nix shell --inputs-from . nixpkgs#ruff nixpkgs#shellcheck -c bash -c \
            'ruff check . && shellcheck tools/*.sh tools/emupod/*.sh'

  build:
    name: Build and unit tests
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.build == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The Nix store (the dev shell's toolchain), kept until flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          gc-max-store-size-linux: 3G
      - name: Build the loader and payload
        run: nix develop -c make -C loader
      # Each pytest job leaves its JUnit XML (and the coverage of tools/) in build/results for the
      # report job below, and writes its own summary.
      - name: Unit tests that don't need Apple's firmware
        run: nix develop -c pytest -v -m 'not firmware and not emupod' --junitxml=build/results/build.xml --cov --cov-report=
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/report.py junit "Unit tests (no firmware)" build/results/build.xml
          [ ! -f .coverage ] || mv .coverage build/results/.coverage.build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-build
          path: build/results
          include-hidden-files: true
          retention-days: 7

  # install.py's raw-disk code, podinfo and coverart on the other OSes people install from
  # (the build job runs them on Linux). Plain Python, no nix: what a user has.
  portable:
    name: Unit tests on ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.build == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow
      - name: install.py, podinfo and coverart tests
        run: python -m pytest -v -m "not firmware and not emupod" tests/test_install.py tests/test_podinfo.py tests/test_coverart.py --junitxml=build/results/portable-${{ matrix.os }}.xml
      - name: Summary
        if: ${{ !cancelled() }}
        run: python .github/scripts/report.py junit "Unit tests on ${{ matrix.os }}" build/results/portable-${{ matrix.os }}.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-portable-${{ matrix.os }}
          path: build/results
          retention-days: 7

  emulator:
    name: Firmware and emulator tests
    needs: changes
    if: ${{ !cancelled() && (inputs.all || needs.changes.outputs.emulator == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: cachix/install-nix-action@v31
      # The Nix store (the dev shell's toolchain), kept until flake.nix or flake.lock changes.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-emu-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-emu-${{ runner.os }}-
          gc-max-store-size-linux: 5G
      # Apple's firmware is never in this repo: it's fetched from Apple (once, then from the
      # Actions cache) and checked.
      - uses: actions/cache@v6
        with:
          path: firmware/iPod_2.2.3.ipsw
          key: ipsw-2.2.3-bec081f2
      - name: Firmware 2.3 from Apple
        run: |
          mkdir -p firmware
          [ -f firmware/iPod_2.2.3.ipsw ] || \
          curl -fsSL -o firmware/iPod_2.2.3.ipsw \
            https://secure-appldnld.apple.com/iPod/SBML/osx/bundles/061-2687.20060912.IPwdC/iPod_2.2.3.ipsw
          echo "bec081f2bacd4099dcfc533048a6844c8fafb50197c60d9d7ef95075cf2c6e92  firmware/iPod_2.2.3.ipsw" | sha256sum -c
      # The built emupod library, keyed on what goes into it: the pinned submodule, our patch
      # and the toolchain. Saved right after the build, so a failing test doesn't lose it.
      - name: emupod cache key
        id: emupod-key
        run: echo "key=emupod-so-${{ runner.os }}-$(git rev-parse HEAD:third_party/emupod)-${{ hashFiles('tools/emupod/emupod-gen3.patch', 'flake.lock') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        id: emupod-cache
        with:
          path: third_party/emupod/emupod/emupod_rs.abi3.so
          key: ${{ steps.emupod-key.outputs.key }}
      - name: emupod (patched; built unless cached)
        run: nix develop .#emu -c tools/emupod/setup.sh
        env:
          EMUPOD_PREBUILT: ${{ steps.emupod-cache.outputs.cache-hit }}
      - uses: actions/cache/save@v6
        if: steps.emupod-cache.outputs.cache-hit != 'true'
        with:
          path: third_party/emupod/emupod/emupod_rs.abi3.so
          key: ${{ steps.emupod-key.outputs.key }}
      - name: Build
        run: |
          nix develop .#emu -c python3 tools/fwtool.py extract firmware/iPod_2.2.3.ipsw -o build/fw
          nix develop .#emu -c make -C loader
      # --require-firmware: a missing firmware file fails the job instead of skipping its tests.
      - name: Unit tests that need Apple's firmware (the rest ran in the build job)
        run: nix develop .#emu -c pytest -v --require-firmware -m 'firmware and not emupod' --junitxml=build/results/firmware.xml --cov --cov-report=
      - name: Test cards
        run: nix develop .#emu -c python3 -m coverage run tools/emupod/mkcards.py
      # The checks run as Python processes of their own; coverage follows them (pyproject.toml).
      - name: Emulator tests
        run: nix develop .#emu -c pytest -v -n auto --durations=0 --require-firmware -m emupod --junitxml=build/results/emupod.xml --cov --cov-append --cov-report=
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/report.py junit "Unit tests that need the firmware" build/results/firmware.xml
          python3 .github/scripts/report.py junit "Emulator checks" build/results/emupod.xml --checks
          [ ! -f .coverage ] || mv .coverage build/results/.coverage.emulator
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: results-emulator
          path: build/results
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: emupod-logs
          path: |
            build/emupod-work/logs
            build/emupod-work/*.png

  # Every job's tests in one "Test results" check (failures annotated at their file and line), the
  # coverage of tools/ from the build and emulator jobs combined, in the summary and in one
  # comment on the pull request that each run updates. Reports only: it never fails for a number.
  report:
    name: Test report
    needs: [build, portable, emulator]
    if: ${{ !cancelled() && (needs.build.result != 'skipped' || needs.emulator.result != 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write         # the Test results check
      pull-requests: write  # the coverage comment
    env:
      # Pull requests from Dependabot and forks get a read-only token: the summary only, then.
      CAN_WRITE: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
      COVERAGE: coverage==7.17.0  # nixpkgs' (flake.lock), which wrote the data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: env.CAN_WRITE == 'true'
        with:
          files: results/*.xml
          check_name: Test results
          comment_mode: 'off'
      - name: Coverage
        id: cov
        run: |
          shopt -s nullglob
          data=(results/.coverage.*)
          [ ${#data[@]} -gt 0 ] || { echo "No coverage data (the build and emulator jobs didn't get that far)."; exit 0; }
          pipx run --spec "$COVERAGE" coverage combine --keep "${data[@]}"
          pipx run --spec "$COVERAGE" coverage json -q -o coverage.json
          python3 .github/scripts/report.py -o coverage.md coverage coverage.json results
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          echo "done=true" >> "$GITHUB_OUTPUT"
      - name: Coverage comment on the pull request
        if: github.event_name == 'pull_request' && env.CAN_WRITE == 'true' && steps.cov.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- frogger-coverage -->'
          printf '%s\n%s\n<sub>%s, [run](%s)</sub>\n' "$marker" "$(cat coverage.md)" "${HEAD::7}" "$RUN" > comment.md
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
                 --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md --jq .html_url
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md --jq .html_url
          fi
